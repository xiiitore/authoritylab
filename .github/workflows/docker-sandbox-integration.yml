name: Docker sandbox integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Start isolated local registry
        shell: bash
        run: |
          set -euo pipefail

          pull_with_retry() {
            local image="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              echo "Pulling ${image} (attempt ${attempt}/5)"
              if docker pull "${image}"; then
                return 0
              fi
              if [ "${attempt}" -lt 5 ]; then
                local delay=$((2 ** attempt))
                echo "Pull failed; retrying in ${delay}s" >&2
                sleep "${delay}"
              fi
            done
            return 1
          }

          # Public registries can rate-limit hosted runners. Retry transient
          # failures, then fall back to Docker Hub's canonical library image.
          if pull_with_retry public.ecr.aws/docker/library/registry:2; then
            REGISTRY_IMAGE="public.ecr.aws/docker/library/registry:2"
          else
            echo "Amazon ECR mirror unavailable; trying Docker Hub fallback." >&2
            pull_with_retry docker.io/library/registry:2
            REGISTRY_IMAGE="docker.io/library/registry:2"
          fi
          docker run -d --restart=unless-stopped --name authoritylab-registry -p 127.0.0.1:5000:5000 "${REGISTRY_IMAGE}"
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "local registry did not become ready" >&2
          docker logs authoritylab-registry || true
          exit 1
      - name: Build and publish ephemeral test image to local registry
        run: |
          docker build --pull -f tests/docker/Dockerfile -t localhost:5000/authoritylab-integration:ci .
          docker push localhost:5000/authoritylab-integration:ci
          IMAGE_DIGEST="$(docker image inspect localhost:5000/authoritylab-integration:ci --format='{{index .RepoDigests 0}}')"
          test -n "$IMAGE_DIGEST"
          echo "AUTHORITYLAB_DOCKER_TEST_IMAGE=$IMAGE_DIGEST" >> "$GITHUB_ENV"
      - name: Run real-container integration tests
        run: python -m pytest -q tests/docker/test_docker_runtime_integration.py
      - name: Collect Docker diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          docker logs authoritylab-registry || true
          docker image ls
