[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authoritylab"
version = "0.1.0"
description = "Evidence-aware workflow orchestration reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AuthorityLab contributors" }]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3", "dulwich>=0.22,<1"]
test = ["pytest>=8,<9", "flake8>=7,<8", "jsonschema>=4.23,<5"]

[tool.setuptools]
packages = ["authoritylab"]
package-dir = { "authoritylab" = "." }

[tool.pytest.ini_options]
import_mode = "importlib"
