[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authoritylab"
version = "0.1.0"
description = "Evidence-aware workflow orchestration reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AuthorityLab contributors" }]
dependencies = []

[tool.setuptools]
packages = ["authoritylab"]
package-dir = { "authoritylab" = "." }
